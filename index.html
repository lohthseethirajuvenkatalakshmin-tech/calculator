<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calculator__header">
        <div>
          <p class="eyebrow">EVERYDAY TOOL</p>
          <h1>Calculator</h1>
        </div>
        <span class="memory-indicator" id="memory-indicator" aria-label="Memory is empty">M</span>
      </header>

      <section class="display" aria-live="polite" aria-atomic="true">
        <div class="display__expression" id="expression" aria-label="Expression"></div>
        <div class="display__result" id="result" aria-label="Result">0</div>
      </section>

      <section class="keypad" aria-label="Calculator keys">
        <button class="key key--utility" data-action="memory-clear" aria-label="Memory clear">MC</button>
        <button class="key key--utility" data-action="memory-recall" aria-label="Memory recall">MR</button>
        <button class="key key--utility" data-action="memory-add" aria-label="Memory add">M+</button>
        <button class="key key--utility" data-action="memory-subtract" aria-label="Memory subtract">M−</button>

        <button class="key key--utility" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key--utility" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="key key--utility" data-value="(" aria-label="Open parenthesis">(</button>
        <button class="key key--operator" data-value="/" aria-label="Divide">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key--operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key--operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key--operator" data-value="+" aria-label="Add">+</button>

        <button class="key key--utility" data-action="sign" aria-label="Toggle sign">+/−</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value="." aria-label="Decimal point">.</button>
        <button class="key key--operator" data-value=")" aria-label="Close parenthesis">)</button>

        <button class="key key--utility key--wide" data-value="%" aria-label="Percent">%</button>
        <button class="key key--equals key--wide" data-action="equals" aria-label="Equals">=</button>
      </section>

      <footer class="calculator__footer">
        <span>Use your keyboard to calculate</span>
        <kbd>Enter</kbd>
      </footer>
    </main>
  </body>
</html>
